const query=document.querySelector('#query'), school=document.querySelector('#school'), eventFilter=document.querySelector('#event');
const status=document.querySelector('#status'), results=document.querySelector('#results');
const days={'26':'목','27':'금','28':'토'};
let day='';
for(const value of [...new Set(rows.map(row=>row.school))].sort()) school.add(new Option(value,value));
for(const value of [...new Set(rows.map(row=>row.event))].sort()) eventFilter.add(new Option(value,value));
function node(tag,text,cls){const e=document.createElement(tag);if(text)e.textContent=text;if(cls)e.className=cls;return e;}
function normalize(text){return text.toLowerCase().replaceAll(/\s/g,'');}
function render(){
 const term=normalize(query.value);
 const selected=rows.filter(row=>(!day||row.day===day)&&(!school.value||row.school===school.value)&&(!eventFilter.value||row.event===eventFilter.value)&&normalize(row.name+row.school+row.event+row.number+row.lane+'레인').includes(term));
 status.textContent=selected.length ? `선수 ${new Set(selected.map(row=>row.name)).size}명 · 선수별 출전 ${selected.length}건` : '조건에 맞는 출전 일정이 없습니다.';
 results.replaceChildren();
 for(const date of Object.keys(days)){
  const daily=selected.filter(row=>row.day===date);
  if(!daily.length)continue;
  const section=node('section');section.append(node('h2',`11월 ${date}일 (${days[date]})`));
  for(const time of new Set(daily.map(row=>row.time))){
   section.append(node('h3',`${time<'12:00'?'오전':'오후'} 경기 · ${time} 시작`));
   const list=node('ul',null,'list');
   for(const row of daily.filter(row=>row.time===time)){
    const item=node('li'), discipline=node('strong',row.event);
    if(row.relay)discipline.append(node('span',' · 단체','team'));
    item.append(discipline,node('span',`${row.name} (${row.grade}학년) · ${row.school}`),node('span',row.relay ? row.number+'번 · 남초등부 2부 · 결승' : row.number+'번 · '+row.heat+'조 · '+row.lane+'레인','meta'));list.append(item);
   }
   section.append(list);
  }
  results.append(section);
 }
}
for(const field of [query,school,eventFilter])field.addEventListener('input',render);
const dates=document.querySelectorAll('nav button');
for(const button of dates)button.addEventListener('click',()=>{day=button.dataset.day;for(const item of dates)item.setAttribute('aria-pressed',String(item===button));render();});
render();
